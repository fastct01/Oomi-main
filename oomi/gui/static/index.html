<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>oomi</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" type="image/png" sizes="128x128" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/favicon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" aria-label="Bots">
    <header class="side-head">
      <span class="wordmark">oomi</span>
      <div class="side-actions">
        <button id="btn-search" class="icon-btn" type="button" title="Find a bot, a message or a command (⌘K)" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        </button>
        <button id="btn-new" class="icon-btn" type="button" title="New bot (⌘N)" aria-label="New bot">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="btn-side-menu" class="icon-btn hidden" type="button" title="Group, sort and more" aria-label="Sidebar options">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
    <nav id="bot-list" class="bot-list"></nav>
    <footer class="side-foot">
      <button id="btn-me" class="me" type="button" title="Account" aria-label="Account">
        <svg class="me-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
      </button>
      <button id="btn-settings" class="me settings" type="button" title="Settings (⌘,)" aria-label="Settings">
        <svg class="me-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37 1 .608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="me-sub" class="sub"></span>
      </button>
    </footer>
  </aside>

  <div class="main">
    <div id="workspace" class="workspace"></div>
    <footer id="statusbar" class="statusbar"></footer>
  </div>

  <aside id="drawer" class="drawer hidden" aria-label="Panel"></aside>
</div>
<div id="drop-hint" class="drop-hint hidden"></div>
<div id="toast" class="toast hidden" role="status"></div>
<input id="file-input" type="file" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/*,.md,.txt,.csv,.json,.py,.js,.ts,.tsx,.jsx,.html,.css,.yaml,.yml,.toml,.sh,.go,.rs,.java,.rb,.swift,.kt,.c,.h,.cpp,.sql,.xml,.log">
<script src="/static/md.js"></script>
<script src="/static/core.js"></script>
<script src="/static/layout.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/panels.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
